<!doctype html>
<title>MyTestDrive — world preview</title>
<style>
  body { margin: 0; background: #0d1016; color: #cfd6e4; font: 13px system-ui, sans-serif; }
  #hud { position: fixed; top: 10px; left: 12px; z-index: 10; line-height: 1.7; }
  button { background: #232a38; color: #cfd6e4; border: 1px solid #3a4459;
           padding: 5px 10px; margin-right: 6px; border-radius: 4px; cursor: pointer; }
  button.on { background: #3c4a63; }
  #stats { margin-top: 8px; opacity: .75; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<div id="hud">
  <button onclick="view('drive')">driver's eye</button>
  <button onclick="view('above')">above the street</button>
  <button onclick="view('over')">overview</button>
  <button id="gbtn" onclick="toggleGraph()">graph wireframe: off</button>
  <div id="stats">loading…</div>
</div>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const RADIUS = 3, CHUNK = 500;
let SPAWN = { x: -73.87, y: 37.64, z: 32.0, heading: -117.0 };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1016);
scene.fog = new THREE.Fog(0x0d1016, 500, 2600);

const camera = new THREE.PerspectiveCamera(62, 1, 0.3, 8000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// innerWidth/innerHeight can be 0 when this module first runs, which silently
// produces a 0x0 canvas and a black screen with no error at all.
function resize() {
  const w = innerWidth || document.documentElement.clientWidth || 1200;
  const h = innerHeight || document.documentElement.clientHeight || 800;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
resize();
addEventListener('resize', resize);

scene.add(new THREE.HemisphereLight(0xc2d6ff, 0x2b2b33, 2.0));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.3);
sun.position.set(-500, -800, 900);
scene.add(sun);

// GLTFLoader lowercases custom attribute names: _BUILDING arrives as _building.
const attr = (g, n) => g.getAttribute(n.toLowerCase()) || g.getAttribute(n);

const buildingMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
// flatShading derives normals in the shader. Without it these meshes carry no
// NORMAL attribute and Lambert lighting renders them pure black. DoubleSide
// because earcut winding on ground polygons is not guaranteed to face up.
const roadMat = new THREE.MeshLambertMaterial({
  vertexColors: true, flatShading: true, side: THREE.DoubleSide,
  // Markings sit ~4cm above the surface, which the depth buffer cannot resolve
  // at distance. Push the road back rather than lifting the paint off the road.
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
});
const markMat = new THREE.LineBasicMaterial({ color: 0xf0ead6 });

// Surveyed surface material codes: asphalt dominates, the rest are setts/pavers.
const MATERIAL_COLOUR = {
  1: 0x8a8d96, 2: 0x7e828c, 4: 0xa08b6e, 5: 0x94866f, 6: 0xab9878, 14: 0x74777f
};

function tintBuildings(geometry) {
  const ids = attr(geometry, '_BUILDING');
  const colours = new Float32Array(ids.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < ids.count; i++) {
    const v = ids.getX(i);
    c.setHSL((v * 0.191) % 1, 0.22, 0.55 + 0.14 * Math.sin(v));
    colours[i * 3] = c.r; colours[i * 3 + 1] = c.g; colours[i * 3 + 2] = c.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colours, 3));
}

function tintRoads(geometry) {
  const mat = attr(geometry, '_MATERIAL');
  const colours = new Float32Array(mat.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < mat.count; i++) {
    c.setHex(MATERIAL_COLOUR[Math.round(mat.getX(i))] ?? 0x333539);
    colours[i * 3] = c.r; colours[i * 3 + 1] = c.g; colours[i * 3 + 2] = c.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colours, 3));
}

const loader = new GLTFLoader();
const counts = { buildings: 0, roadTris: 0, marks: 0, chunks: 0 };

function load(url, onMesh) {
  loader.load(url, (gltf) => {
    gltf.scene.traverse((node) => { if (node.isMesh || node.isLine) onMesh(node); });
    scene.add(gltf.scene);
    counts.chunks++;
    document.getElementById('stats').textContent =
      `${counts.chunks} chunks · ${counts.buildings.toLocaleString()} buildings · ` +
      `${counts.roadTris.toLocaleString()} road triangles · ` +
      `${counts.marks.toLocaleString()} marking segments`;
  }, undefined, () => {});
}

for (let cx = -RADIUS; cx <= RADIUS; cx++) {
  for (let cy = -RADIUS; cy <= RADIUS; cy++) {
    load(`../data/build/buildings/chunk_${cx}_${cy}.glb`, (m) => {
      tintBuildings(m.geometry); m.material = buildingMat;
      counts.buildings += new Set(
        Array.from({ length: attr(m.geometry, '_BUILDING').count },
                   (_, i) => attr(m.geometry, '_BUILDING').getX(i))).size;
    });
    load(`../data/build/roads/road_${cx}_${cy}.glb`, (m) => {
      tintRoads(m.geometry); m.material = roadMat;
      counts.roadTris += m.geometry.index.count / 3;
    });
    load(`../data/build/roads/marking_${cx}_${cy}.glb`, (m) => {
      m.material = markMat;
      counts.marks += m.geometry.index.count / 2;
    });
  }
}

// Debug only: the graph centreline that drives movement. Never part of the app.
const graphGroup = new THREE.Group();
graphGroup.visible = false;
scene.add(graphGroup);
fetch('../data/build/graph.json').then(r => r.json()).then((graph) => {
  const v = [];
  for (const e of graph.edges)
    for (let i = 0; i < e.points.length - 1; i++) {
      const a = e.points[i], b = e.points[i + 1];
      v.push(a[0], a[1], a[2] + 0.5, b[0], b[1], b[2] + 0.5);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  graphGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x6fd3a0 })));
  SPAWN = { ...graph.spawn.point && {}, x: graph.spawn.point[0], y: graph.spawn.point[1],
            z: graph.spawn.z, heading: graph.spawn.heading };
  view('drive');
});

window.toggleGraph = () => {
  graphGroup.visible = !graphGroup.visible;
  const b = document.getElementById('gbtn');
  b.textContent = `graph wireframe: ${graphGroup.visible ? 'on' : 'off'}`;
  b.className = graphGroup.visible ? 'on' : '';
};

window.view = (mode) => {
  const rad = SPAWN.heading * Math.PI / 180;
  camera.up.set(0, 0, 1);
  if (mode === 'drive') {
    // Eye height above the road surface, looking along the spawn heading.
    camera.position.set(SPAWN.x, SPAWN.y, SPAWN.z + 1.5);
    camera.lookAt(SPAWN.x + Math.cos(rad) * 140, SPAWN.y + Math.sin(rad) * 140, SPAWN.z + 1.9);
  } else if (mode === 'above') {
    camera.position.set(SPAWN.x - Math.cos(rad) * 70, SPAWN.y - Math.sin(rad) * 70, SPAWN.z + 28);
    camera.lookAt(SPAWN.x + Math.cos(rad) * 160, SPAWN.y + Math.sin(rad) * 160, SPAWN.z);
  } else {
    camera.position.set(SPAWN.x - 700, SPAWN.y - 700, SPAWN.z + 520);
    camera.lookAt(SPAWN.x, SPAWN.y, SPAWN.z);
  }
};
view('drive');

Object.assign(window, { scene, camera, renderer, THREE });

(function loop() {
  requestAnimationFrame(loop);
  const c = renderer.domElement;
  if (c.width !== c.clientWidth || c.height !== c.clientHeight) resize();
  renderer.render(scene, camera);
})();
</script>
